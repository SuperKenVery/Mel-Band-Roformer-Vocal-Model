[package]
name = "melband_roformer"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.20.1", features = ["wgpu", "train"] }
burn-import = { version = "0.20.1", features = ["pytorch"] }
burn-wgpu = "0.20.1"
burn-ndarray = "0.20.1" # For CPU operations if needed
candle-core = ">=0.9.1,<0.9.2"
bytemuck = "1.14.3"
rustfft = "6.2.0"
rubato = "0.14"
symphonia = { version = "0.5.3", features = ["mp3", "pcm", "wav"] }
hound = "3.5.1"
anyhow = "1.0.81"
clap = { version = "4.5.3", features = ["derive"] }
safetensors = "0.4.2"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
log = "0.4.21"
env_logger = "0.11.3"
realfft = "3.3.0" # Might be useful for real-valued FFT
num-complex = "0.4.5"
itertools = "0.12.1"
memmap2 = "0.9.10"

[[bin]]
name = "model_test"
path = "src/bin/model_test.rs"
